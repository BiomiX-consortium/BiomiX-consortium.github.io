<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>BiomiX community and stability</title>
  <desc>Diagram showing Docker, Nextflow, GitHub, active development, community and multi-institution network around BiomiX</desc>

  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#90caf9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background rings -->
  <circle cx="340" cy="168" r="130" fill="none" stroke="#2196f3" stroke-width="0.5" stroke-dasharray="4 6" opacity="0.22"/>
  <circle cx="340" cy="168" r="90"  fill="none" stroke="#2196f3" stroke-width="0.5" stroke-dasharray="3 5" opacity="0.15"/>

  <!-- Connector lines -->
  <line x1="340" y1="168" x2="160" y2="90"  stroke="#90caf9" stroke-width="1" fill="none" opacity="0.5" marker-end="url(#arr2)"/>
  <line x1="340" y1="168" x2="520" y2="90"  stroke="#90caf9" stroke-width="1" fill="none" opacity="0.5" marker-end="url(#arr2)"/>
  <line x1="340" y1="168" x2="160" y2="250" stroke="#90caf9" stroke-width="1" fill="none" opacity="0.5" marker-end="url(#arr2)"/>
  <line x1="340" y1="168" x2="520" y2="250" stroke="#90caf9" stroke-width="1" fill="none" opacity="0.5" marker-end="url(#arr2)"/>
  <line x1="340" y1="168" x2="340" y2="32"  stroke="#90caf9" stroke-width="1" fill="none" opacity="0.5" marker-end="url(#arr2)"/>
  <line x1="340" y1="168" x2="340" y2="300" stroke="#90caf9" stroke-width="1" fill="none" opacity="0.5" marker-end="url(#arr2)"/>

  <!-- Centre: BiomiX hub -->
  <circle cx="340" cy="168" r="44" fill="#2196f3" stroke="#1565c0" stroke-width="0.5"/>
  <text x="340" y="164" text-anchor="middle" font-family="Inter,sans-serif" font-size="14" font-weight="700" fill="#ffffff">BiomiX</text>
  <text x="340" y="180" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.8)">3.0</text>

  <!-- Top: Docker -->
  <rect x="285" y="8"   width="110" height="46" rx="8" fill="#e0f2f1" stroke="#80cbc4" stroke-width="0.5"/>
  <text x="340" y="29"  text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#00695c">Docker</text>
  <text x="340" y="44"  text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#00897b">Reproducible setup</text>

  <!-- Bottom: Nextflow -->
  <rect x="285" y="298" width="110" height="46" rx="8" fill="#e0f2f1" stroke="#80cbc4" stroke-width="0.5"/>
  <text x="340" y="319" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#00695c">Nextflow</text>
  <text x="340" y="334" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#00897b">Scalable pipelines</text>

  <!-- Top-left: GitHub -->
  <rect x="76"  y="64"  width="112" height="46" rx="8" fill="#eceff1" stroke="#b0bec5" stroke-width="0.5"/>
  <text x="132" y="85"  text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#37474f">GitHub</text>
  <text x="132" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#546e7a">Open source</text>

  <!-- Top-right: Active dev -->
  <rect x="494" y="64"  width="118" height="46" rx="8" fill="#e8f5e9" stroke="#a5d6a7" stroke-width="0.5"/>
  <text x="553" y="85"  text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#2e7d32">Active dev</text>
  <text x="553" y="100" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#388e3c">Regular updates</text>

  <!-- Bottom-left: Community -->
  <rect x="76"  y="228" width="112" height="46" rx="8" fill="#ede7f6" stroke="#b39ddb" stroke-width="0.5"/>
  <text x="132" y="249" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#4527a0">Community</text>
  <text x="132" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#512da8">Researchers &amp; devs</text>

  <!-- Bottom-right: Multi-institution -->
  <rect x="494" y="228" width="118" height="46" rx="8" fill="#fff8e1" stroke="#ffe082" stroke-width="0.5"/>
  <text x="553" y="249" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#e65100">Multi-institution</text>
  <text x="553" y="264" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" fill="#ef6c00">Europe-wide network</text>

</svg>
